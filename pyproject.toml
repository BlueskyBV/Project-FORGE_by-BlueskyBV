[project]
name = "forge"
version = "0.1.0"
description = "An evidence-driven parametric mechanical design system"
# CPython 3.14 is the floor and the runtime (ADR-0023): on the laptop, the runners
# and in Docker, since 15 November 2026, when the restructured code gave the same
# results on it as on 3.13 for the held-out and counted seeds and every kept
# regression. (V1 was verified on 3.10 to 3.12; it is frozen and runs on 3.14.)
requires-python = ">=3.14"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# The trust core needs none of these. They arrive with the backends.
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.18"]
# The exact kernel (forge_occ): OpenCascade 8.0.1 through the OCP wheel Forge is built and tested
# against (ADR-0022), and lib3mf for 3MF. Pinned exactly: forge_occ refuses to run on any other.
exact = ["cadquery-ocp-novtk==8.0.1.1.0", "lib3mf==2.5.0"]
simulation = ["gmsh>=4.12"]        # meshing (planned; invoked out-of-process)
optimisation = ["scipy>=1.11", "optuna>=3.6"]

[project.scripts]
forge = "forge_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
# The 3D viewer the live page shows the finished part in (three.js, MIT),
# copied beside each run so the page works offline.
forge_cli = ["viewer/*"]
# forge_numeric's compiled twin, one library per platform, built by CI (native.yml; ADR-0037).
forge_numeric = ["_native/*/*"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]   # long lines in prose docstrings are deliberate

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
mypy_path = "packages"
namespace_packages = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Only scripts/font_metrics.py reads the font file itself; the spec layer
# reads the table it writes (packages/forge_spec/font.py).
module = "fontTools.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The tests alone make reference meshes with manifold3d; Forge never imports it.
module = "manifold3d.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The exact kernel's bindings (forge_occ): OpenCascade through OCP, and 3MF through lib3mf.
# Neither ships type information; forge_occ types what it takes from them as Any.
module = ["OCP.*", "lib3mf.*"]
ignore_missing_imports = true
