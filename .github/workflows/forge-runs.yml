# Forge's runs on GitHub's runners. Started by hand only (gh workflow run): this workflow never runs on a
# push (trust-core.yml does).
# Each shard is one runner (4 cores, 16 GB); the free plan runs up to 20 at once, each up to 6 hours.
#
# Every runner is held to one instruction level (x86-64-v3: AVX2, no AVX-512) for NumPy and OpenBLAS:
# GitHub's runners are AMD or Intel, and their SIMD paths round the last bit differently (found
# 15 Nov 2026: the judge's digests of 3 of 20 parts differed between an AVX-512 Intel and an AVX2 AMD
# until both were held to x86-64-v3). With it, a part's digests are the same on any runner.
#
# mode fingerprint: tests/v2_fingerprint.py on this commit's code.
# mode pair:        the same seeds on this commit's code (fin) and on the branch named by base, one after
#                   the other on the same runner, so both sides of every comparison come from one machine.
# mode tests:       the test files named by tests (all: every tests/test_*.py), one pytest process each,
#                   split over the shards, on this commit (and on base when given), each with its peak memory.
# mode pypair:      the same seeds on this commit's code under CPython 3.13.18 (base) and under the Python
#                   named by python (fin), one after the other on the same runner (the fingerprint harness).
# mode pyexit:      the same, with stage 4's exit harness (tests/v2_exit4.py) on a contiguous seed range
#                   (seeds "A-B"), split over the shards: parts built, judged and graded, mutants,
#                   impossible specs, and every tenth part's second kernel and files.
# mode compare:     a finished pair run's records (run_id) merged and held against each other here, so
#                   only the summary has to be fetched.
# mode coverage_report: a finished coverage run's data (run_id) combined here, and the step-0 inventory's
#                   functions reported branch by branch.
# mode coverage:    branch coverage of the base branch's code over its share of the seeds, and (cover_tests)
#                   over its share of base's test files: the old bodies' coverage (V2-stage4b-0b.md, 6.3).
name: forge-runs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fingerprint, pair, pypair, pyexit, tests, coverage, coverage_report or compare"
        default: "fingerprint"
      seeds:
        description: "Seeds, as tests/v2_fingerprint.py --seeds takes them"
        default: "sample:20"
      shards:
        description: "Runners to split the seeds over (1 to 20)"
        default: "1"
      hash_seed:
        description: "PYTHONHASHSEED"
        default: "0"
      verdicts:
        description: "Build and judge each part (true or false)"
        default: "false"
      base:
        description: "The branch the pair and tests modes hold this commit against"
        default: "proof/base-4b0b"
      tests:
        description: "Test files for the tests mode, space separated, or all"
        default: ""
      cover_tests:
        description: "Coverage mode: also run base's test files (true or false)"
        default: "false"
      run_id:
        description: "Compare mode: the pair run to compare"
        default: ""
      python:
        description: "The Python (pypair and pyexit: the second one, held against 3.13.18, the one before ADR-0023's move)"
        default: "3.14.10"

permissions:
  contents: read
  actions: read

env:
  NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
  OPENBLAS_CORETYPE: "Haswell"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.split.outputs.shards }}
    steps:
      - id: split
        env:
          SHARDS: ${{ inputs.shards }}
        run: python3 -c "import json, os; n = max(1, min(20, int(os.environ['SHARDS']))); print('shards=' + json.dumps(list(range(n))))" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: fin
      - uses: actions/checkout@v4
        if: inputs.mode != 'fingerprint' && inputs.base != ''
        with:
          ref: ${{ inputs.base }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ (inputs.mode == 'pypair' || inputs.mode == 'pyexit') && '3.13.18' || inputs.python }}
      - uses: actions/setup-python@v5
        if: inputs.mode == 'pypair' || inputs.mode == 'pyexit'
        with:
          python-version: ${{ inputs.python }}
      - name: Forge's pinned tools
        env:
          MODE: ${{ inputs.mode }}
          PYB: ${{ inputs.python }}
        run: |
          if [ "$MODE" = "pypair" ] || [ "$MODE" = "pyexit" ]; then
            for exe in python3.13 "python$(echo "$PYB" | cut -d. -f1-2)"; do
              $exe -VV
              $exe -m pip install --upgrade pip
              $exe -m pip install -r fin/.github/requirements-runner.txt
            done
          else
            python -m pip install --upgrade pip
            python -m pip install -r fin/.github/requirements-runner.txt
          fi
      - name: The environment
        run: |
          python -VV
          python -c "import numpy; numpy.show_runtime()"
          lscpu | grep -E 'Model name|^CPU\(s\)'
          free -g | head -2
      - name: Fingerprints
        if: inputs.mode == 'fingerprint' || inputs.mode == 'pair'
        env:
          PYTHONHASHSEED: ${{ inputs.hash_seed }}
          SEEDS: ${{ inputs.seeds }}
          SHARDS: ${{ inputs.shards }}
          SHARD: ${{ matrix.shard }}
          VERDICTS: ${{ inputs.verdicts }}
          MODE: ${{ inputs.mode }}
        run: |
          MINE=$(cd fin && python .github/shard.py "$SEEDS" "$SHARDS" "$SHARD")
          EXTRA=""; [ "$VERDICTS" = "true" ] && EXTRA="--verdicts"
          SIDES="fin"; [ "$MODE" = "pair" ] && SIDES="base fin"
          for side in $SIDES; do
            (cd $side && python tests/v2_fingerprint.py --seeds "$MINE" --out "$GITHUB_WORKSPACE/out/$side/shard-$SHARD" --workers 4 $EXTRA)
          done
      - name: Python pair
        if: inputs.mode == 'pypair' || inputs.mode == 'pyexit'
        env:
          PYTHONHASHSEED: ${{ inputs.hash_seed }}
          SEEDS: ${{ inputs.seeds }}
          SHARDS: ${{ inputs.shards }}
          SHARD: ${{ matrix.shard }}
          VERDICTS: ${{ inputs.verdicts }}
          MODE: ${{ inputs.mode }}
          PYB: ${{ inputs.python }}
        run: |
          B="python$(echo "$PYB" | cut -d. -f1-2)"
          cd fin
          if [ "$MODE" = "pypair" ]; then
            MINE=$(python3.13 .github/shard.py "$SEEDS" "$SHARDS" "$SHARD")
            EXTRA=""; [ "$VERDICTS" = "true" ] && EXTRA="--verdicts"
            python3.13 tests/v2_fingerprint.py --seeds "$MINE" --out "$GITHUB_WORKSPACE/out/base/shard-$SHARD" --workers 4 $EXTRA
            $B tests/v2_fingerprint.py --seeds "$MINE" --out "$GITHUB_WORKSPACE/out/fin/shard-$SHARD" --workers 4 $EXTRA
          else
            read FROM TO < <(python3.13 -c "import sys; a, b = map(int, sys.argv[1].split('-')); n, k = int(sys.argv[2]), int(sys.argv[3]); print(a + (b - a) * k // n, a + (b - a) * (k + 1) // n)" "$SEEDS" "$SHARDS" "$SHARD")
            python3.13 tests/v2_exit4.py --from "$FROM" --to "$TO" --workers 4 --out "$GITHUB_WORKSPACE/out/base/shard-$SHARD" || true
            $B tests/v2_exit4.py --from "$FROM" --to "$TO" --workers 4 --out "$GITHUB_WORKSPACE/out/fin/shard-$SHARD" || true
          fi
      - name: Tests
        if: inputs.mode == 'tests'
        env:
          TESTS: ${{ inputs.tests }}
          BASE: ${{ inputs.base }}
          SHARDS: ${{ inputs.shards }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p out
          [ "$TESTS" = "all" ] && TESTS=$(cd fin && ls tests/test_*.py)
          N=$SHARDS; [ "$N" -gt 20 ] && N=20; [ "$N" -lt 1 ] && N=1  # as the plan job caps them
          MINE=""; i=0
          for f in $TESTS; do [ $((i % N)) -eq "$SHARD" ] && MINE="$MINE $f"; i=$((i + 1)); done
          SIDES="fin"; [ -n "$BASE" ] && SIDES="base fin"
          for side in $SIDES; do
            for f in $MINE; do
              [ -f "$side/$f" ] || { echo "$side $f absent" >> out/tests.txt; continue; }
              log="$GITHUB_WORKSPACE/out/$side-$(basename $f .py).log"
              (cd $side && PYTHONPATH=packages python -c "import resource, subprocess, sys; rc = subprocess.call([sys.executable, '-m', 'pytest', '-q', '-p', 'no:cacheprovider', sys.argv[1]], stdout=open(sys.argv[2], 'w'), stderr=subprocess.STDOUT); print(rc, resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss)" "$f" "$log") > out/rcrss.txt
              echo "$side $f rc_and_maxrss_kb $(cat out/rcrss.txt) $(tail -n 1 "$log")" >> out/tests.txt
            done
          done
          cat out/tests.txt
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'compare' || inputs.mode == 'coverage_report'
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: in
      - name: Compare
        if: inputs.mode == 'compare'
        run: |
          mkdir -p out
          cd fin && python .github/compare_run.py "$GITHUB_WORKSPACE/in" "$GITHUB_WORKSPACE/merged"
          cp "$GITHUB_WORKSPACE/merged/compare.txt" "$GITHUB_WORKSPACE/out/compare.txt"
      - name: Coverage report
        if: inputs.mode == 'coverage_report'
        run: |
          python -m pip install coverage==7.17.3
          mkdir -p out
          cd fin && python .github/coverage_report.py "$GITHUB_WORKSPACE/in" "$GITHUB_WORKSPACE/base" "$GITHUB_WORKSPACE/covrep"
          cp "$GITHUB_WORKSPACE/covrep/report.md" "$GITHUB_WORKSPACE/covrep/summary.tsv" "$GITHUB_WORKSPACE/out/"
      - name: Coverage
        if: inputs.mode == 'coverage'
        env:
          PYTHONHASHSEED: ${{ inputs.hash_seed }}
          SEEDS: ${{ inputs.seeds }}
          SHARDS: ${{ inputs.shards }}
          SHARD: ${{ matrix.shard }}
          COVER_TESTS: ${{ inputs.cover_tests }}
        run: |
          python -m pip install coverage==7.17.3
          mkdir -p out/cov
          MINE=$(cd fin && python .github/shard.py "$SEEDS" "$SHARDS" "$SHARD")
          cd base
          python -m coverage run -p --branch --source=packages --data-file="$GITHUB_WORKSPACE/out/cov/.coverage" \
            ../fin/.github/cov_run.py . "$MINE"
          if [ "$COVER_TESTS" = "true" ]; then
            for f in $(ls tests/test_*.py | awk -v n="$SHARDS" -v k="$SHARD" '(NR - 1) % n == k'); do
              PYTHONPATH=packages timeout 3000 python -m coverage run -p --branch --source=packages \
                --data-file="$GITHUB_WORKSPACE/out/cov/.coverage" -m pytest -q -p no:cacheprovider "$f" \
                > "$GITHUB_WORKSPACE/out/cov/$(basename $f .py).log" 2>&1 || true
            done
          fi
          ls -la "$GITHUB_WORKSPACE/out/cov" | head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.shard }}
          path: out/
          include-hidden-files: true
          retention-days: 30
