# The trust core on every push to main (ADR-0023): its tests on CPython 3.14, the runtime, and on 3.15 and the
# free-threaded 3.14t, where OCP has no wheels yet, so the move is ready the day it ships them; and, with nothing
# pinned, on Windows, macOS and ARM Linux (ADR-0037: the same numbers on every machine). The files are found by
# .github/trust_core_tests.py (everything Forge they import is L0); only NumPy and the test tools are installed
# beside them (ADR-0034), and the free-threaded build runs with the GIL off.
name: trust-core

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"

jobs:
  trust-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.14.10", files: all}
          - {os: ubuntu-24.04, python: "3.15", files: all}
          - {os: ubuntu-24.04, python: "3.14t", files: all}
          - {os: ubuntu-24.04-arm, python: "3.14.10", files: numeric}
          - {os: windows-2025, python: "3.14.10", files: numeric}
          - {os: macos-15, python: "3.14.10", files: numeric}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: trust core on ${{ matrix.os }} ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: NumPy and the test tools
        run: |
          python -m pip install --disable-pip-version-check -q numpy==2.5.3 pytest==9.1.1 hypothesis==6.170.15
          python -c "import sys, sysconfig, platform, numpy; print(sys.version, platform.machine(), 'free-threaded:', bool(sysconfig.get_config_var('Py_GIL_DISABLED')), 'numpy', numpy.__version__)"
      - name: The trust core's tests
        env:
          PYTHONPATH: packages
          PYTHON_GIL: ${{ endsWith(matrix.python, 't') && '0' || '' }}
          FILES: ${{ matrix.files }}
        run: |
          python -c "from forge_numeric import _native, scalar, vector; print('compiled twin:', vector._use is not None, _native.WHY_NOT, '| numbers:', scalar._two is not None, scalar.WHY_NOT)"
          if [ "$FILES" = "all" ]; then python .github/trust_core_tests.py > trust-core-tests.txt; else echo tests/test_v2_numeric.py > trust-core-tests.txt; fi
          echo "$(wc -l < trust-core-tests.txt) files"
          python -m pytest -q -p no:cacheprovider $(cat trust-core-tests.txt)
